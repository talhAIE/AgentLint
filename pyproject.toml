[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlint"
version = "0.1.0"
description = "Audit AI coding-agent instruction files for drift against the actual repository."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
agentlint = "agentlint.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line too long — existing code exceeds 88 in many places
    "F401",   # unused import — re-exports in __init__.py files
    "F841",   # unused variable — test fixtures use locals for readability
    "W291",   # trailing whitespace
    "W292",   # no newline at end of file
    "W293",   # whitespace before ':'
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841"]
"agentlint/**/__init__.py" = ["F401"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentlint*"]
