[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlint"
version = "0.1.0"
description = "Audit AI coding-agent instruction files for drift against the actual repository."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
agentlint = "agentlint.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentlint*"]
